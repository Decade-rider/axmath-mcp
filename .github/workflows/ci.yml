name: Windows unit checks (no Office integration)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-package:
    name: Python 3.12 unit tests and package checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the tested uv and Python versions
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.8.11"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked project and development dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check src tests scripts

      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests scripts

      # These tests mock Office calls. Real Word/AxMath conversion and visual
      # verification require a separately provisioned Windows desktop session.
      - name: Run unit tests without Office
        run: uv run --no-sync pytest -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Check distribution contents
        run: uv run --no-sync python scripts/check_dist.py
