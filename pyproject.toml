[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axmath-mcp"
version = "0.4.0"
description = "Local MCP tools for editable AxMath equations in Microsoft Word and PowerPoint"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "mcp>=1.26,<2",
  "pywin32>=310; sys_platform == 'win32'",
]

[project.scripts]
axmath-mcp = "axmath_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/axmath_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "scripts", "config", "docs", ".github",
  "README.md", "pyproject.toml", "uv.lock", ".gitignore", ".gitattributes",
  "LICENSE", "NOTICE",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

